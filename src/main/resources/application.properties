# 轻量工作流编排可配置项
# 同时执行任务数的硬上限，互不依赖的任务可并发，但并发度绝不超过该值
workflow.orchestration.max-concurrency=4
# 单任务最大尝试次数（首次执行 + 重试）；临时错误/超时达到该次数后任务与工作流稳定失败
workflow.orchestration.max-attempts=3
# 临时失败后下一次尝试前的固定等待毫秒数
workflow.orchestration.retry-backoff-millis=50
# 单任务单次尝试的耗时上限毫秒数，超时中断并按一次可重试失败计数
workflow.orchestration.task-timeout-millis=5000
